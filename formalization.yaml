fidelity:
  divergences: >-
    (a) The height. H is Mathlib's Height.mulHeight₁ for its instance on a
    number field K: the product over infinite places of max(|x|_v, 1)^m_v
    (m_v = 1 or 2) times the product over finite places. It is the height
    relative to K, the [K:Q]-th power of the absolute Weil height
    (DefinitionAudit.mulHeight₁_two: H(2) = 2^[K:Q]). In statement 3 the
    field is L, of degree 12. (b) The sums over conjugates run over the
    ring homomorphisms K -> C, of which there are exactly [K:Q]
    (DefinitionAudit.card_embeddings); each complex place contributes two.
    (c) In the uncompared equality case, "root of unity" is stated as:
    x^m = 1 for some m > 0; no compared statement uses it. (d) M(x) is
    Polynomial.mahlerMeasure of minpoly Z x mapped to C[X]; for x in O_L
    the minimal polynomial is monic (DefinitionAudit.minpoly_monic_of_integer),
    so the junk value 0 of minpoly does not occur; the same holds for minpoly Z (rho * Q), since rho and Q are integral (ρ_isIntegral_int, Q_isIntegral_int in the carried block). (e) "x generates L" is
    stated as Q⟮x⟯ = ⊤. (f) The field L is the tower K3 = Q[X]/(X^3 - X - 1),
    L = K3[Y]/(Y^4 - Y - 1); rho and Q are the adjoined roots. Statements
    3-5 do not depend on a choice of embedding. (g) Perron numbers: Lind's
    definition (r >= 1, integral, every other complex root of minpoly Z r
    of modulus < r). Statement 5 says "some embedding sends x to a real
    Perron number r", stated as: there are sigma : L -> C and r real with
    sigma x = r and IsPerronNumber r. For integral generators of L,
    replacing r >= 1 by r > 1 gives the same statement
    (HeightT2.isPerronAt_iff_isPerronNumber, not compared). (h) The T2
    Gram matrix is defined with complex entries
    sum over sigma of sigma(b_i) * star(sigma(b_k)); its real part
    t2GramRe is used in statement 2, whose hypotheses state positive
    semidefiniteness as nonnegativity of v . (M v) for every real vector v.
    (i) Statement 1 needs no finiteness of the index types; statement 2
    takes them finite with decidable equality. (j) Statements 1 and 2 are
    for intermediate fields K1, K2 of a number field E with
    K1.LinearDisjoint K2 and K1 ⊔ K2 = ⊤. For statement 1 neither hypothesis
    can be dropped (HeightT2.control_t2Gram_compositum_needs_sup;
    HeightT2.Review.kron_needs_linearDisjoint). For statement 2 linear
    disjointness cannot be dropped
    (HeightT2.control_coord_sq_le_needs_linearDisjoint), and s, t >= 0
    cannot both be dropped (HeightT2.control_coord_sq_le_needs_signs);
    the uncompared probe HeightT2.Review.coord_of_hs_only proves the bound
    with t >= 0 deleted (s >= 0 kept). Whether K1 ⊔ K2 = ⊤ is needed for
    the bound of statement 2 (it is needed for statement 1) is not
    settled here.

