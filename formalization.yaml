# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "The integral generators of least Mahler measure of the field of x^3 - x - 1 and x^4 - x - 1, with the T2 Gram matrix of a compositum"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of five statements. Let
    L = Q(rho, Q) be the field generated by a root rho of x^3 - x - 1 and
    a root Q of x^4 - x - 1, a number field of degree 12. For a number
    field K and x in K write T2(x) = sum over the [K:Q] ring homomorphisms
    sigma : K -> C of |sigma x|^2, and H(x) = Height.mulHeight1 x for
    Mathlib's multiplicative height of x relative to K (the [K:Q]-th power
    of the absolute Weil height). M(x) is the Mahler measure of the
    minimal polynomial of an algebraic integer x over Z. General
    statements: (1)
    for subfields K1, K2 of a number field E, linearly disjoint with
    K1 v K2 = E, the T2 Gram matrix (sum over sigma of
    sigma(b_i) conj(sigma(b_k))) of a product family b_i c_j over E is
    the Kronecker product of the T2 Gram matrices of b over K1 and of c
    over K2; (2) in that setting, if s, t >= 0 and Re G_b - s E_ii and
    Re G_c - t E_jj are positive semidefinite, then every rational
    coefficient vector a satisfies s t a_ij^2 <= T2(sum a_kl b_k c_l).
    Statements about L: (3) the nonzero algebraic integers x of L with
    H(x) <= H(rho Q) are exactly the fourteen elements +-1,
    +-rho^(+-1), +-Q^(+-1), +-(rho Q)^(+-1); (4) every algebraic integer
    x of L with Q(x) = L has M(rho Q) <= M(x), with equality exactly for
    x in {rho Q, -rho Q, (rho Q)^-1, -(rho Q)^-1}; since rho Q generates L (proved in the repository, not compared), the least Mahler
    measure of an integral generator of L (Dubickas's M(O_L)) is
    M(rho Q), attained at these four elements only; (5) an algebraic
    integer generating L, of least Mahler measure among the algebraic
    integers generating L, that some embedding sends to a real Perron
    number (Lind's definition), is rho Q (one direction; the converse,
    that rho Q satisfies the hypotheses, is proved in the repository and
    not compared). The Challenge imports Mathlib only and carries the
    definition block of the author's registered entry
    PALOMAR-2026-10-21-000012 (the field L and its elements) and three
    definitions of this entry (IsPerronNumber, t2Gram, t2GramRe). Not
    claimed: the inequality T2(x) <= H(x)^2 + n - 1 for x in a number field of degree n, proved in the
    repository and not compared, is Lemma 6 of Dubickas (Rev. Mat.
    Iberoam. 39 (2023)) applied to the squares max(1, |sigma x|)^2; that
    lemma states no case of equality. The case of equality, T2(x) =
    H(x)^2 + (n - 1) exactly when x is a root of unity (for n >= 2), is
    proved in the repository (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff)
    and is not compared; no statement of it in print was located
    (README.md, "Relation to the literature", lists where it was searched)
    and novelty is not claimed. Statements (3)-(5) are about L only.
    Statement (1) is the
    Hermitian counterpart of the trace-form identity of the author's entry
    PALOMAR-2026-09-02-000014 (statement 3); neither is a special case of the other.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # MSC2020 codes, all in the registry's snapshot (PalomarSubmission,
  # taxonomies/msc2020-codes.json): 11R06 (PV-numbers and generalizations;
  # other special algebraic numbers; Mahler measure), 11G50 (heights),
  # 11R04 (algebraic numbers; rings of algebraic integers), 11R21 (other
  # number fields), 11C08 (polynomials in number theory), 68V20
  # (formalization of mathematics in connection with theorem provers).
  # arXiv: math.NT (the mathematics), cs.LO (the formalization) and math-ph
  # (the cited application of the field L; see README.md, "Context"). All
  # three are in the registry's arXiv snapshot.
  arxiv: ["math.NT", "cs.LO", "math-ph"]
  msc2020: ["11R06", "11G50", "11R04", "11R21", "11C08", "68V20"]

sources:
  - title: "Least Mahler measure among the integral generators of Q(rho, Q) and the T2 Gram matrix of a compositum (the five compared statements)"
    authors:
      - "Stephanie Alexander"
    type: "original-proof"
    location: "README.md, sections 'The compared statements', 'The proofs' and 'Relation to the literature'"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      ORIGIN DECLARATION (relationship "other" because the schema has no
      value for a result presented together with its formalization). This
      declaration covers the five compared statements and nothing else. No
      prior formalization of any of them was found in the recorded search
      (README.md, "Prior formalizations"); the literature searched for
      statements 1-2 is listed in README.md, "Relation to the literature".
      The case of equality, T2(x) = H(x)^2 + (n - 1) exactly when x is a
      root of unity (for n >= 2), is proved in the repository
      (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff), is NOT compared and
      is not covered by this declaration; novelty is not claimed for it
      (README.md, "Relation to the literature", lists where it was
      searched). The
      inequality T2(x) <= H(x)^2 + n - 1 for every x in a number field of
      degree n is proved in the repository
      (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add) and is NOT compared: it
      is Dubickas's Lemma 6 applied to squared absolute values (see that
      source below). The bridge lemmas between Mathlib's height and the
      product over embeddings, and the identity M(minpoly x) = H(x) for
      an integral generator, are not compared; more general forms are
      formalized elsewhere (related_formalizations). That rho Q satisfies
      the hypotheses of statement 5 is not compared either (that rho Q
      exceeds the modulus of its other conjugates is statement 13 of the
      author's entry PALOMAR-2026-09-01-000005).
    license: "MIT"
  - title: "Minimal Mahler measures for generators of some fields"
    authors:
      - "Artūras Dubickas"
    id: "doi:10.4171/RMI/1331"
    type: "paper"
    location: "https://doi.org/10.4171/RMI/1331"
    relationship: "background"
    note: >-
      Rev. Mat. Iberoam. 39 (2023), no. 1, 269-282 (published online 4 January 2022, as the article states). Opened (full text). Defines M(O_K), the infimum of the
      Mahler measures of the algebraic integers generating K (p. 269),
      the quantity statement 4 determines for K = L. Lemma 6 (p. 275):
      y_1 + ... + y_k <= k - 1 + y_1 ... y_k for real y_i >= 1, applied on
      p. 279 to the conjugates of modulus at least 1. Applied instead to
      the squares y_i = max(1, |sigma_i x|)^2, Lemma 6 gives the inequality
      T2(x) <= H(x)^2 + n - 1. The repository proves Lemma 6
      (RulerSelection.sum_add_one_le_prod_add_card) and that inequality
      (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add) as supporting theorems,
      which are not compared. The proof of the equality case
      (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff, proved in the
      repository and not compared) uses Lemma 6 and its strict form when
      two of the y_i exceed 1 (HeightT2.sum_add_one_lt_prod_add_card, read
      off the expansion in the lemma's proof); the proofs of compared
      statements 3-5 use the instance of
      the squared inequality for L in the copied library
      (RulerSelection.Emb.T2_le_embHeight_sq_add). The lemma states no
      case of equality.
    license: "CC BY 4.0 (as marked on the article)"
    author_endorsement: "not-contacted"
  - title: "Zwei Sätze über Gleichungen mit ganzzahligen Coefficienten"
    authors:
      - "Leopold Kronecker"
    id: "doi:10.1515/crll.1857.53.173"
    type: "paper"
    location: "https://doi.org/10.1515/crll.1857.53.173"
    relationship: "background"
    note: >-
      J. Reine Angew. Math. 53 (1857), 173-175. Not opened; cited as
      restated in Smyth's two surveys below. Kronecker's theorem (an
      algebraic integer all of whose conjugates have modulus at most 1 is
      0 or a root of unity) is used through Mathlib's
      NumberField.Embeddings.pow_eq_one_of_norm_eq_one in the proof of
      the equality case HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff
      (proved in the repository, not compared); not re-proved.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Algebraic Numbers and Fourier Analysis"
    authors:
      - "Raphaël Salem"
    id: "D. C. Heath, Boston, 1963"
    type: "book"
    location: "p. 26"
    relationship: "background"
    note: >-
      Not opened; cited as restated, with proof, in Smyth (2015), Lemma 1
