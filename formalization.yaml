  statements:
    - source: "This work"
      lean: "IntegralGeneratorHeights.mulHeight₁_le_mulHeight₁_ρQ_iff"
      module: "Solution"
      status: "proved"
      note: "The fourteen nonzero algebraic integers of L with H(x) <= H(rho Q)."
    - source: "This work"
      lean: "IntegralGeneratorHeights.mahlerMeasure_generator_min"
      module: "Solution"
      status: "proved"
      note: >-
        Every integral generator x of L has M(rho Q) <= M(x), with equality
        exactly at rho Q, -rho Q, (rho Q)^-1, -(rho Q)^-1.
    - source: "This work"
      lean: "IntegralGeneratorHeights.perronNumber_generator_selection"
      module: "Solution"
      status: "proved"
      note: >-
        An integral generator x of L with M(x) <= M(y) for every integral
        generator y of L, and with a real Perron image (Lind) under some
        embedding, is rho Q. One direction.

