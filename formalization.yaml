status:
  scope: >-
    Formalized: five compared theorems, in comparator order, namespace
    IntegralGeneratorHeights (see the description for their content), on
    the definitions carried by the Challenge. Proved in the repository,
    not compared: the inequality T2(x) <= H(x)^2 + n - 1 for every x in a
    number field of degree n (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add;
    Dubickas's Lemma 6 applied to squares); the bridge lemmas
    H(x) = prod over sigma of max(1, |sigma x|) for integral x and <= for
    every x (HeightT2.mulHeight₁_eq_prod_embeddings,
    HeightT2.prod_embeddings_le_mulHeight₁); the equality case, T2(x) =
    H(x)^2 + (n - 1) iff x is a root of unity for n >= 2
    (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff), and its integral
    form; the real form of statement 1
    (HeightT2.t2GramRe_compositum) and its quadratic-form version; the
    embedding form of statement 5 with the predicate IsPerronAt
    (HeightT2.perronAt_generator_selection) and the equivalence of the
    two predicates on integral generators of L
    (HeightT2.isPerronAt_iff_isPerronNumber); the two-way form of
    statement 5 and its non-vacuity at rho Q (HeightT2.perron_selection,
    HeightT2.ρQ_perronNumber_generator_selected); the coordinate box of L
