alignment:
  namespace: "IntegralGeneratorHeights"
  statements:
    - source: "This work"
      lean: "IntegralGeneratorHeights.t2Gram_compositum"
      module: "Solution"
      status: "proved"
      note: >-
        The T2 Gram matrix of a product family over a linearly disjoint
        compositum is the Kronecker product of the factors' T2 Gram
        matrices.
    - source: "This work"
      lean: "IntegralGeneratorHeights.coord_sq_le_sum_norm_sq"
      module: "Solution"
      status: "proved"
      note: >-
        Coordinate bound s t a_ij^2 <= T2(sum a_kl b_k c_l) from positive
        semidefinite certificates on the factors' T2 Gram matrices. No
        height appears.
    - source: "This work"
      lean: "IntegralGeneratorHeights.mulHeight₁_le_mulHeight₁_ρQ_iff"
      module: "Solution"
      status: "proved"
      note: "The fourteen nonzero algebraic integers of L with H(x) <= H(rho Q)."
    - source: "This work"
      lean: "IntegralGeneratorHeights.mahlerMeasure_generator_min"
      module: "Solution"
      status: "proved"
      note: >-
        Every integral generator x of L has M(rho Q) <= M(x), with equality
        exactly at rho Q, -rho Q, (rho Q)^-1, -(rho Q)^-1.
    - source: "This work"
      lean: "IntegralGeneratorHeights.perronNumber_generator_selection"
      module: "Solution"
      status: "proved"
      note: >-
        An integral generator of L of least Mahler measure that some
        embedding sends to a real Perron number (Lind) is rho Q. One
        direction.

