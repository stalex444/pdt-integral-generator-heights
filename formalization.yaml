status:
  scope: >-
    Formalized: three compared theorems, in comparator order, namespace
    IntegralGeneratorHeights (see the description for their content), on
    the definitions carried by the Challenge; all three are about L.
    Proved in the repository, not compared: the inequality T2(x) <=
    H(x)^2 + n - 1 for every x in a number field of degree n
    (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add; Dubickas's Lemma 6 applied
    to squares), whose instance for L in the copied library
    (RulerSelection.Emb.T2_le_embHeight_sq_add) the compared proofs use;
    the bridge lemmas H(x) = prod over sigma of max(1, |sigma x|) for
    integral x and <= for every x (HeightT2.mulHeight₁_eq_prod_embeddings,
    HeightT2.prod_embeddings_le_mulHeight₁); the equality case, T2(x) =
    H(x)^2 + (n - 1) iff x is a root of unity for n >= 2
    (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff), and its integral
    form; the T2 Gram identity for a linearly disjoint compositum
    (HeightT2.t2Gram_compositum; special cases are in print, README.md,
    "Relation to the literature"), its real form
    (HeightT2.t2GramRe_compositum) and its quadratic-form version; the
    coordinate bound (HeightT2.coord_sq_le_sum_norm_sq; for families that
    are bases, Fincke and Pohst (1985), (2.9), applied to the Kronecker
    product); the embedding form of statement 3 with the predicate
    IsPerronAt (HeightT2.perronAt_generator_selection) and the
    equivalence of the two predicates on integral generators of L
    (HeightT2.isPerronAt_iff_isPerronNumber); the two-way form of
    statement 3 and its non-vacuity at rho Q (HeightT2.perron_selection,
    HeightT2.ρQ_perronNumber_generator_selected); the coordinate box of L
    re-derived through the Gram identity and the coordinate bound
    (HeightT2.box_of_embHeight_le), whose statement is that of the copied
    chain's box (HeightT2.box_of_embHeight_le_chain;
    HeightT2.box_routes_agree, by rfl; HeightT2/Instance/Box.lean); no
    compared proof uses the theorems HeightT2.t2Gram_compositum,
    HeightT2.coord_sq_le_sum_norm_sq or the equality case (the compared
    proofs compute T2 on L by RulerSelection.Emb.T2_coords, the content of
    the Gram identity for L and its power bases, proved directly); controls showing each key hypothesis needed
    (HeightT2.control_*); the copied libraries HermiteCompositum/ and
    RulerSelection/. Not formalized: any field other than L in the
    compared statements; the absolute Weil height as such (only Mathlib's
    relative height); the case of equality of the inequality for x in a
    field of degree 1 (it is excluded and fails; control
    HeightT2.control_finrank_two_needed); any physical interpretation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

