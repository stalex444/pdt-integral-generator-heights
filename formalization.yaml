  # 11R04 (algebraic numbers; rings of algebraic integers), 11R21 (other
  # number fields), 11C08 (polynomials in number theory), 68V20
  # (formalization of mathematics in connection with theorem provers).
  # arXiv: math.NT (the mathematics), cs.LO (the formalization) and math-ph
  # (the cited application of rho Q; see README.md, "Context"). All
  # three are in the registry's arXiv snapshot.
  arxiv: ["math.NT", "cs.LO", "math-ph"]
  msc2020: ["11R06", "11G50", "11R04", "11R21", "11C08", "68V20"]

sources:
  - title: "The nonzero algebraic integers of QQ(rho, Q) of height at most H(rho Q), the least Mahler measure of an integral generator, and the Perron selection of rho Q (the three compared statements)"
    authors:
      - "Stephanie Alexander"
    type: "original-proof"
    location: "README.md, sections 'The compared statements', 'The proofs' and 'Relation to the literature'"
    relationship: "other"
    author_endorsement: "participated"
    note: >-
      ORIGIN DECLARATION (relationship "other" because the schema has no
      value for a result presented together with its formalization). This
      declaration covers the three compared statements and nothing else.
      No prior formalization of any of them was found in the recorded
      search (README.md, "Prior formalizations"). The following are proved
      in the repository, are NOT compared and are NOT covered by this
      declaration; none is claimed as this entry's. (i) The inequality
      T2(x) <= H(x)^2 + n - 1 for every x in a number field of degree n
      (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add): Dubickas's Lemma 6
      applied to squared absolute values (see that source below). (ii) Its
      case of equality, T2(x) = H(x)^2 + (n - 1) exactly when x is a root
      of unity, for n >= 2 (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff);
      novelty is not claimed (README.md, "Relation to the literature",
      lists where it was searched). (iii) The T2 Gram identity for a
      linearly disjoint compositum (HeightT2.t2Gram_compositum): special
      cases of it are in print (the three background sources below:
      Popov-Zarhin 2021, Lyubashevsky-Peikert-Regev 2013,
      Bayer-Fluckiger-Oggier-Viterbo 2004), and novelty is not claimed.
      (iv) The coordinate bound (HeightT2.coord_sq_le_sum_norm_sq): for
      families that are bases it is the bound (2.9) of Fincke and Pohst
      (1985) applied to the Kronecker product of the factors' T2 Gram
      matrices (see that source below); it also covers singular Gram
      matrices; novelty is not claimed. (v) That rho Q satisfies the
      hypotheses of statement 3 (that rho Q exceeds the modulus of its
      other conjugates is statement 13 of the author's entry
      PALOMAR-2026-09-01-000005). The proofs of the compared statements use
      the instance of (i) for L in the copied library and a direct proof of
      the content of (iii) for L and its power bases
      (RulerSelection.Emb.T2_coords); they use neither (ii) nor the theorems
      (iii) and (iv) as stated. The bridge lemmas between Mathlib's height and the
      product over embeddings, and the identity M(minpoly x) = H(x) for an
      integral generator, are not compared either; more general forms are
      formalized elsewhere (related_formalizations).
    license: "MIT"
  - title: "Minimal Mahler measures for generators of some fields"
    authors:
      - "Artūras Dubickas"
    id: "doi:10.4171/RMI/1331"
    type: "paper"
    location: "https://doi.org/10.4171/RMI/1331"
    relationship: "background"
    note: >-
      Rev. Mat. Iberoam. 39 (2023), no. 1, 269-282 (published online 4 January 2022, as the article states). Opened (full text). Defines M(O_K), the infimum of the
      Mahler measures of the algebraic integers generating K (p. 269),
      the quantity statement 2 determines for K = L. Lemma 6 (p. 275):
      y_1 + ... + y_k <= k - 1 + y_1 ... y_k for real y_i >= 1, applied on
      p. 279 to the conjugates of modulus at least 1. Applied instead to
      the squares y_i = max(1, |sigma_i x|)^2, Lemma 6 gives the inequality
      T2(x) <= H(x)^2 + n - 1. The repository proves Lemma 6
      (RulerSelection.sum_add_one_le_prod_add_card) and that inequality
      (HeightT2.sum_norm_sq_le_mulHeight₁_sq_add) as supporting theorems,
      which are not compared. The proof of the equality case
      (HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff, proved in the
      repository and not compared) uses Lemma 6 and its strict form when
      two of the y_i exceed 1 (HeightT2.sum_add_one_lt_prod_add_card, read
      off the expansion in the lemma's proof); the proofs of compared
      statements 1-3 use the instance of
      the squared inequality for L in the copied library
      (RulerSelection.Emb.T2_le_embHeight_sq_add). The lemma states no
      case of equality.
    license: "CC BY 4.0 (as marked on the article)"
    author_endorsement: "not-contacted"
  - title: "Zwei Sätze über Gleichungen mit ganzzahligen Coefficienten"
    authors:
      - "Leopold Kronecker"
    id: "doi:10.1515/crll.1857.53.173"
    type: "paper"
    location: "https://doi.org/10.1515/crll.1857.53.173"
    relationship: "background"
    note: >-
      J. Reine Angew. Math. 53 (1857), 173-175. Opened (scan, Zenodo
      record 2258989). Theorem I (p. 173): if the roots of a monic integer
      equation are all non-real of modulus 1, they are roots of unity;
      restated in Smyth (2015), p. 2. Kronecker's theorem in this
      modulus-one form is used through Mathlib's
      NumberField.Embeddings.pow_eq_one_of_norm_eq_one in the proof of
      the equality case HeightT2.sum_norm_sq_eq_mulHeight₁_sq_add_iff
